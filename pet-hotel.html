<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Boarding & Sitters | Animedic</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="top-header" id="app-header"></header>
      <main class="page-content">
        
<div class="section-header">
  <div>
    <h1 style="font-size:1.45rem;">Verified Pet Boarding & Sitters</h1>
    <p class="section-sub">Hygiene-audited pet hotels and home sitters near your location.</p>
  </div>
  <select id="hotel-sort" class="form-select" style="width:auto;min-width:210px;" aria-label="Sort pet hotels">
    <option value="distance-asc">Nearest First</option>
    <option value="distance-desc">Farthest First</option>
    <option value="price-asc">Price: Lowest to Highest</option>
    <option value="price-desc">Price: Highest to Lowest</option>
    <option value="rating-desc">Rating: Highest to Lowest</option>
    <option value="rating-asc">Rating: Lowest to Highest</option>
  </select>
</div>

<div class="grid-3" id="hotel-grid"></div>

<div class="modal-backdrop" id="hotel-modal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="hotel-modal-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <span class="badge badge-orange mb-2">Protected Boarding</span>
    <h2 id="hotel-modal-title" style="font-size:1.28rem;margin-bottom:4px;"></h2>
    <p id="hotel-modal-sub" style="font-size:0.82rem;color:var(--slate-500);margin-bottom:16px;"></p>

    <form id="hotel-booking-form">
      <div class="form-group">
        <div class="flex-between">
          <label class="form-label" style="margin-bottom:0;">Select Pets</label>
          <label style="font-size:0.8rem;font-weight:600;color:var(--orange-primary);display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="hotel-select-all" style="accent-color:var(--orange-primary);">
            <span>Select All Pets</span>
          </label>
        </div>
        <div class="pet-check-list" id="hotel-pet-checkboxes"></div>
        <div class="form-error" id="hotel-pet-err">Please select at least 1 pet to continue.</div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="hotel-checkin">Check-In Date</label>
          <input type="date" id="hotel-checkin" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="hotel-checkout">Check-Out Date</label>
          <input type="date" id="hotel-checkout" class="form-input" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="hotel-pay-method">Payment Method</label>
        <select id="hotel-pay-method" class="form-select" required>
          
          <option value="Debit / Credit Card">Debit / Credit Card</option>
          <option value="QRIS">QRIS</option>
          <option value="GoPay">GoPay</option>
          <option value="OVO">OVO</option>
          <option value="Bank Virtual Account">Bank Virtual Account</option>

        </select>
      </div>

      <div style="background:var(--bg-page);border:1px solid var(--slate-200);border-radius:12px;padding:14px;margin-bottom:16px;font-size:0.85rem;">
        <div class="receipt-row">
          <div class="receipt-left">
            <div class="receipt-title">Boarding Stay</div>
            <div class="receipt-sub" id="hotel-nights-label">Price breakdown</div>
          </div>
          <div class="receipt-right amount" style="color:var(--orange-primary);font-size:1rem;" id="hotel-total-price">Rp&nbsp;0</div>
        </div>
        <p style="font-size:0.75rem;color:var(--slate-500);margin-top:6px;">Payment protected until your service is complete.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Confirm & Pay</button>
    </form>
  </div>
</div>

      </main>
    </div>
  </div>
  <nav class="bottom-nav" id="app-bottom-nav"></nav>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
  <script>
    const currentUser = AnimedicApp.initShell("pet-hotel");
    
if (currentUser) {
  let selectedHotel = null;
  const grid = document.getElementById("hotel-grid");
  const modal = document.getElementById("hotel-modal");
  const selectAllEl = document.getElementById("hotel-select-all");
  const petBoxEl = document.getElementById("hotel-pet-checkboxes");
  const petErrEl = document.getElementById("hotel-pet-err");

  const hotelSortEl = document.getElementById("hotel-sort");

  function renderHotels() {
    const sortVal = hotelSortEl.value;
    const list = [...ANIMEDIC_DATA.petHotels].sort((a, b) => {
      if (sortVal === "distance-asc") return a.distanceKm - b.distanceKm;
      if (sortVal === "distance-desc") return b.distanceKm - a.distanceKm;
      if (sortVal === "price-asc") return a.pricePerNight - b.pricePerNight;
      if (sortVal === "price-desc") return b.pricePerNight - a.pricePerNight;
      if (sortVal === "rating-desc") return b.rating - a.rating;
      if (sortVal === "rating-asc") return a.rating - b.rating;
      return 0;
    });

    grid.innerHTML = list.map(h => `
      <div class="card card-hover provider-card">
        <div>
          <div class="flex-between mb-2">
            <span class="badge badge-green">${AnimedicApp.ICONS.shield} Hygiene Verified</span>
            <div class="flex-row" style="gap:6px;">
              <span class="badge badge-navy">${AnimedicApp.ICONS.star} ${h.rating.toFixed(1)}</span>
              <span class="badge badge-orange">${h.availableSlots} slots left</span>
            </div>
          </div>
          <h3 style="font-size:1.05rem;margin-bottom:2px;">${h.name}</h3>
          <div style="font-size:0.82rem;color:var(--slate-500);margin-bottom:10px;">${h.type} | ${h.location} (${h.distanceKm} km from your location)</div>
          <div class="flex-row" style="gap:6px;margin-bottom:10px;">
            ${h.amenities.map(a => `<span class="badge badge-navy">${a}</span>`).join("")}
          </div>
          <div style="font-size:0.78rem;color:var(--slate-600);">Supported: ${h.supportedPets.join(", ")}</div>
        </div>
        <div class="flex-between" style="border-top:1px solid var(--slate-100);padding-top:12px;">
          <div>
            <div style="font-size:0.72rem;color:var(--slate-500);">Nightly Rate</div>
            <div class="price-tag">${AnimedicApp.formatIDR(h.pricePerNight)}</div>
          </div>
          <button type="button" class="btn btn-primary btn-sm book-hotel-btn" data-id="${h.id}">Book Stay</button>
        </div>
      </div>
    `).join("");

    grid.querySelectorAll(".book-hotel-btn").forEach(btn => {
      btn.onclick = () => openHotelModal(btn.dataset.id);
    });
  }

  function openHotelModal(hotelId) {
    selectedHotel = ANIMEDIC_DATA.petHotels.find(h => h.id === hotelId);
    if (!selectedHotel) return;
    document.getElementById("hotel-modal-title").textContent = selectedHotel.name;
    document.getElementById("hotel-modal-sub").textContent = `${selectedHotel.type} | ${selectedHotel.location} (${selectedHotel.distanceKm} km from your location)`;

    const pets = currentUser.pets || [];
    petBoxEl.innerHTML = pets.map((p, idx) => `
      <label class="pet-check-item">
        <div class="flex-row" style="gap:8px;">
          <input type="checkbox" value="${p.id}" ${idx === 0 ? "checked" : ""}>
          <strong>${p.name}</strong>
          <span style="font-size:0.78rem;color:var(--slate-500);">${p.type}</span>
        </div>
        ${AnimedicApp.renderGenderBadge(p.gender)}
      </label>
    `).join("");

    petBoxEl.querySelectorAll("input[type='checkbox']").forEach(cb => {
      cb.onchange = updateHotelTotal;
    });

    const tomorrow = new Date(Date.now() + 86400000);
    const threeDays = new Date(Date.now() + 3 * 86400000);
    document.getElementById("hotel-checkin").value = tomorrow.toISOString().split("T")[0];
    document.getElementById("hotel-checkout").value = threeDays.toISOString().split("T")[0];
    petErrEl.style.display = "none";
    updateHotelTotal();
    modal.classList.add("open");
  }

  function getSelectedPets() {
    const checkedIds = Array.from(petBoxEl.querySelectorAll("input[type='checkbox']:checked")).map(cb => cb.value);
    return (currentUser.pets || []).filter(p => checkedIds.includes(p.id));
  }

  function updateHotelTotal() {
    if (!selectedHotel) return;
    const inDate = new Date(document.getElementById("hotel-checkin").value);
    const outDate = new Date(document.getElementById("hotel-checkout").value);
    let nights = Math.round((outDate - inDate) / 86400000);
    if (isNaN(nights) || nights < 1) nights = 1;

    const chosen = getSelectedPets();
    const count = chosen.length;
    const total = selectedHotel.pricePerNight * count * nights;
    document.getElementById("hotel-nights-label").textContent = `${AnimedicApp.formatIDR(selectedHotel.pricePerNight)} x ${count} pet${count === 1 ? "" : "s"} x ${nights} night${nights === 1 ? "" : "s"}`;
    document.getElementById("hotel-total-price").textContent = AnimedicApp.formatIDR(total);

    const allCbs = petBoxEl.querySelectorAll("input[type='checkbox']");
    selectAllEl.checked = allCbs.length > 0 && count === allCbs.length;
    if (count > 0) petErrEl.style.display = "none";
  }

  hotelSortEl.onchange = renderHotels;
  renderHotels();

  selectAllEl.onchange = () => {
    petBoxEl.querySelectorAll("input[type='checkbox']").forEach(cb => {
      cb.checked = selectAllEl.checked;
    });
    updateHotelTotal();
  };

  document.getElementById("hotel-checkin").onchange = updateHotelTotal;
  document.getElementById("hotel-checkout").onchange = updateHotelTotal;
  document.getElementById("hotel-modal-close").onclick = () => modal.classList.remove("open");

  document.getElementById("hotel-booking-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const chosen = getSelectedPets();
    if (chosen.length === 0) {
      petErrEl.style.display = "block";
      return;
    }
    const inVal = document.getElementById("hotel-checkin").value;
    const outVal = document.getElementById("hotel-checkout").value;
    let nights = Math.max(1, Math.round((new Date(outVal) - new Date(inVal)) / 86400000));

    AnimedicState.addBooking({
      type: "Pet Boarding",
      providerName: selectedHotel.name,
      serviceName: `Boarding Stay (${nights} nights, ${chosen.length} pet${chosen.length === 1 ? "" : "s"})`,
      petId: chosen[0].id,
      petName: chosen.map(p => p.name).join(", "),
      date: inVal + " to " + outVal,
      paymentMethod: document.getElementById("hotel-pay-method").value,
      totalAmount: selectedHotel.pricePerNight * chosen.length * nights,
      commissionRate: 0.15
    });

    modal.classList.remove("open");
    AnimedicApp.showToast("Boarding reservation confirmed.");
    setTimeout(() => { window.location.href = "bookings.html"; }, 900);
  });
}

  </script>
</body>
</html>
