<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Consultation | Animedic</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main class="consultation-layout">
        <!-- Triage Wizard -->
        <div id="triage-wizard" class="modal active">
            <div class="modal-content glassmorphism">
                <div class="wizard-step step-1 active">
                    <h3>Select Pet</h3>
                    <select id="pet-species"><option value="dog">Dog</option><option value="cat">Cat</option></select>
                    <button class="btn-primary next-step">Next</button>
                </div>
                <div class="wizard-step step-2">
                    <h3>Symptoms</h3>
                    <textarea id="symptoms" placeholder="Describe symptoms..."></textarea>
                    <button class="btn-primary next-step">Next</button>
                </div>
                <div class="wizard-step step-3">
                    <h3>Upload Media</h3>
                    <div id="drag-drop-zone">Drag & Drop Image Here</div>
                    <button class="btn-primary start-call">Start Consultation</button>
                </div>
            </div>
        </div>

        <!-- Video Call Interface -->
        <div id="video-interface" class="hidden">
            <div class="video-main">
                <div class="status-indicator"><span class="dot green"></span> Connected</div>
                <div class="pip-view" id="local-video" draggable="true">Local View</div>
                <div class="controls">
                    <button id="toggle-mute">Mute</button>
                    <button id="toggle-cam">Camera</button>
                </div>
            </div>
            <div class="chat-sidebar">
                <div id="chat-messages"></div>
                <input type="text" id="chat-input" placeholder="Type a message...">
            </div>
        </div>
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
