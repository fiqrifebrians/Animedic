<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home-Visit Groomers | Animedic</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="grooming-calculator glassmorphism">
            <h2>Calculate Grooming Price</h2>
            <select id="grm-pet"><option value="1">Dog</option><option value="0.8">Cat</option></select>
            <select id="grm-size"><option value="1">Small</option><option value="1.5">Large</option></select>
            <select id="grm-hair"><option value="1">Short</option><option value="1.2">Long</option></select>
            
            <div class="addons">
                <label><input type="checkbox" class="grm-addon" value="10"> Nail Clipping (+$10)</label>
                <label><input type="checkbox" class="grm-addon" value="15"> Ear Cleaning (+$15)</label>
            </div>
            <h3>Estimated Total: $<span id="grm-total">45.00</span></h3>
        </section>

        <section class="portfolio-masonry" id="portfolio-gallery">
            <img src="../assets/groom-1.jpg" alt="Before and After" class="lightbox-trigger">
            <img src="../assets/groom-2.jpg" alt="Before and After" class="lightbox-trigger">
        </section>
        
        <div id="lightbox-modal" class="hidden">
            <span id="close-lightbox">×</span>
            <img id="lightbox-img" src="" alt="Enlarged">
        </div>
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
