<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home-Visit Vets | Animedic</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="map-section">
            <div id="map-mockup">
                <div id="map-pin" draggable="true">📍</div>
            </div>
            <p id="geocoded-address">Drag pin to set location</p>
        </section>

        <section class="roster-section" id="vet-roster">
            <!-- Cards injected via JS -->
        </section>

        <section class="booking-flow glassmorphism">
            <h3>Book a Visit</h3>
            <input type="date" id="visit-date">
            <div class="service-chips">
                <span class="chip" data-price="50">General Checkup</span>
                <span class="chip" data-price="30">Vaccination</span>
            </div>
            <div class="price-calculator">
                Total: $<span id="booking-total">0</span>
            </div>
        </section>
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
