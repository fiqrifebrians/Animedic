<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Integrated Pharmacy | Animedic</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="pharmacy-layout">
        <aside class="sidebar-filters">
            <h3>Filters</h3>
            <label><input type="checkbox" class="filter-type" value="prescription"> Prescription</label>
            <label><input type="checkbox" class="filter-type" value="diet"> Diet</label>
            <input type="range" id="price-slider" min="0" max="200" value="200">
            <span id="price-display">Max: $200</span>
            <select id="sort-items"><option value="asc">Price: Low to High</option></select>
        </aside>
        
        <main class="product-grid" id="product-grid">
            <!-- Populated via JS -->
        </main>
    </div>

    <!-- Off-canvas Cart -->
    <div id="side-cart" class="side-cart">
        <button id="close-cart">×</button>
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-summary">
            <p>Subtotal: $<span id="cart-subtotal">0</span></p>
            <p>Tax: $<span id="cart-tax">0</span></p>
            <p>Total: $<span id="cart-total">0</span></p>
        </div>
    </div>
    
    <div id="toast-container"></div>
    <script src="../js/global.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
