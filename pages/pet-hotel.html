<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Hotel & Sitter | Animedic</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="search-engine">
            <input type="date" id="check-in">
            <input type="date" id="check-out">
            <div class="view-toggles">
                <button id="toggle-grid" class="active">Grid View</button>
                <button id="toggle-map">Map View</button>
            </div>
        </section>

        <section id="hotel-results" class="grid-view">
            <!-- Facility Cards Injected -->
        </section>

        <section class="booking-validation glassmorphism">
            <h3>Finalize Booking</h3>
            <form id="hotel-booking-form">
                <label class="vaccine-check">
                    <input type="checkbox" id="vaccine-verified"> Vaccine Passport Verified
                </label>
                <button type="submit" class="btn-primary">Book Stay</button>
            </form>
        </section>
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
