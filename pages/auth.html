<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Animedic</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body class="auth-body">
    <div id="navbar-placeholder"></div>
    <div class="auth-container">
        <div class="auth-panels">
            <div class="auth-panel login-panel active">
                <h2>Welcome Back</h2>
                <form id="login-form">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <label><input type="checkbox" id="remember-me"> Remember Me</label>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p>Don't have an account? <span class="toggle-auth">Sign Up</span></p>
            </div>
            <div class="auth-panel signup-panel">
                <h2>Create Account</h2>
                <form id="signup-form">
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <div class="password-strength"><div class="strength-bar"></div></div>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                <p>Already have an account? <span class="toggle-auth">Login</span></p>
            </div>
        </div>
    </div>
    <script src="../js/global.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
