<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Animedic</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editorial.css">
</head>
<body data-page="auth" data-public="true">
  <div class="auth-page" id="auth-page-root">
    <div class="auth-card fade-view" id="auth-card">
      <div class="brand-logo" style="padding:0 0 20px;">
        <span class="brand-mark"><img src="assets/logo.png" alt="Animedic logo"></span>
        <span>Animedic</span>
      </div>

      <!-- Auth View -->
      <div id="auth-view" class="fade-view">
        <h1 id="auth-title" style="font-size:1.45rem;margin-bottom:6px;">Sign in to Animedic</h1>
        <p id="auth-subtitle" style="font-size:0.88rem;color:var(--slate-500);margin-bottom:22px;">
          Access your pet health records, consultations, and home visit bookings.
        </p>

        <!-- Sign In Form (Default) -->
        <form id="signin-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="signin-email">Email</label>
            <input type="email" id="signin-email" class="form-input" placeholder="Enter your email address" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signin-password">Password</label>
            <div class="password-field-wrap"><input type="password" id="signin-password" class="form-input" placeholder="Enter your password" required><button type="button" class="pw-toggle-btn" data-target="signin-password" aria-label="Show password"></button></div>
          </div>
          <div class="form-error mb-2" id="signin-error"></div>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
          <p style="text-align:center;font-size:0.86rem;color:var(--slate-600);margin-top:18px;">
            Don't have an account? <a href="#" id="switch-to-signup" style="color:var(--orange-primary);font-weight:600;">Sign Up</a>
          </p>
        </form>

        <!-- Sign Up Form (Hidden by default) -->
        <form id="signup-form" style="display:none;" novalidate>
          <div class="form-group">
            <label class="form-label" for="signup-name">Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="Enter your name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" class="form-input" placeholder="Enter your email address" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="password-field-wrap"><input type="password" id="signup-password" class="form-input" placeholder="Create a password" required><button type="button" class="pw-toggle-btn" data-target="signup-password" aria-label="Show password"></button></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-confirm">Confirm Password</label>
            <div class="password-field-wrap"><input type="password" id="signup-confirm" class="form-input" placeholder="Re-enter your password" required><button type="button" class="pw-toggle-btn" data-target="signup-confirm" aria-label="Show password"></button></div>
          </div>
          <ul class="validation-list mb-2" id="signup-validation-list"></ul>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
          <p style="text-align:center;font-size:0.86rem;color:var(--slate-600);margin-top:18px;">
            Already have an account? <a href="#" id="switch-to-signin" style="color:var(--orange-primary);font-weight:600;">Sign In</a>
          </p>
        </form>
      </div>

      <!-- Post-Login Onboarding Wizard -->
      <div id="wizard-view" class="fade-view" style="display:none;opacity:0;">
        <div class="progress-track">
          <div class="progress-fill" id="wizard-progress" style="width:12%;"></div>
        </div>
        <div id="wizard-body"></div>
      </div>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11.15.0/dist/motion.js" defer></script>
  <script src="js/motion-system.js" defer></script>
</body>
</html>
