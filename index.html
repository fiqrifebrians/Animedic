<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animedic | On-Demand Pet Healthcare</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main>
        <section class="hero-section">
            <div class="hero-blob"></div>
            <div class="hero-content">
                <h1>Complete Pet Healthcare, Delivered.</h1>
                <div class="search-container">
                    <input type="text" id="service-search" placeholder="Search services (e.g., Vet, Grooming)...">
                    <button class="btn-primary">Search</button>
                </div>
            </div>
        </section>

        <section class="metrics-section">
            <div class="metric-card">
                <h2 class="counter" data-target="10000">0</h2>
                <p>Pets Helped</p>
            </div>
            <div class="metric-card">
                <h2 class="counter" data-target="500">0</h2>
                <p>Expert Vets</p>
            </div>
        </section>

        <section class="testimonials-slider">
            <div class="slider-track" id="testimonial-track">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    
    <script src="js/global.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
